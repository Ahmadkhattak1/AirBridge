[workspace]
members = ["crates/airbridge-core", "crates/airbridge-cli", "crates/airbridge-app", "crates/airbridge-radio"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["AirBridge contributors"]

[workspace.dependencies]
anyhow = "1.0"
flate2 = "1.1"
plist = "1.10"
rcgen = { version = "0.14", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.48", features = ["full"] }

